<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dad Fit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dad Fit">
<meta name="theme-color" content="#15171a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15171a; --raised: #1d2024; --raised-2: #24282d; --iron: #3a4048;
    --text: #eceae4; --dim: #8f9498; --accent: #ff5a2e; --done: #7c9a6f; --done-bg: #212b1e;
    --rule: #2c3136; --bad: #ff8a6a; --bad-bg: #2e1d18;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0efe9; --raised: #ffffff; --raised-2: #e9e7df; --iron: #cfccc2;
      --text: #1c1d1a; --dim: #6b6a63; --accent: #d9491f; --done: #4f7442; --done-bg: #e3ecdd;
      --rule: #d9d7cd; --bad: #a3321a; --bad-bg: #f8e3dc;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); min-height: 100vh; }
  button, input, textarea { font-family: inherit; font-size: 16px; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  .kicker { font-size: 12px; color: var(--dim); }
  h1 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; margin: 4px 0 16px; }

  .big { width: 100%; border: none; border-radius: 14px; background: var(--accent); color: #fff; padding: 22px 18px 20px; text-align: left; display: flex; align-items: center; gap: 16px; }
  .big .letter { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: 0.85; width: 48px; text-align: center; }
  .big .t1 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; display: block; }
  .big .t2 { font-size: 14px; opacity: 0.92; margin-top: 3px; display: block; }
  .big:active:not(:disabled) { transform: scale(0.99); }
  .quick { width: 100%; margin-top: 8px; border: 1px solid var(--iron); background: var(--raised); border-radius: 12px; padding: 14px; font-weight: 600; font-size: 15px; min-height: 50px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .alt { border: 1px solid var(--rule); background: var(--raised); border-radius: 12px; padding: 14px 12px; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 56px; }
  .alt .letter { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; }
  .alt .t { font-size: 14px; font-weight: 600; display: block; }
  .alt .s { font-size: 12px; color: var(--dim); display: block; }
  .extras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .chip { border: 1px dashed var(--iron); background: none; border-radius: 10px; padding: 13px 10px; font-size: 15px; color: var(--dim); min-height: 48px; }

  .card { margin-top: 16px; border-radius: 12px; padding: 14px; background: var(--done-bg); border: 1px solid var(--done); }
  .card .title { font-weight: 600; font-size: 16px; }
  .card .sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .card textarea { width: 100%; margin-top: 12px; background: var(--bg); border: 1px solid var(--iron); border-radius: 9px; padding: 10px; min-height: 64px; resize: vertical; line-height: 1.4; }
  .card .actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn { flex: 1; border: none; border-radius: 10px; padding: 13px; font-weight: 600; font-size: 15px; background: var(--raised-2); min-height: 46px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.undo { flex: 0 0 auto; background: none; border: 1px solid var(--iron); color: var(--accent); padding: 13px 20px; }
  .card.gone { background: var(--raised); border-color: var(--rule); }

  .banner { margin-bottom: 14px; border-radius: 12px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; background: var(--bad-bg); border: 1px solid var(--bad); color: var(--text); }
  .banner b { color: var(--bad); }
  .banner button { margin-top: 10px; }

  .keyform { background: var(--raised); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
  .keyform label { display: block; font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
  .keyform input { width: 100%; background: var(--bg); border: 1px solid var(--iron); border-radius: 9px; padding: 12px; }
  .keyform .btn { margin-top: 12px; width: 100%; }

  .status { font-size: 13px; color: var(--dim); margin-top: 22px; text-align: center; line-height: 1.5; }

  /* session guide */
  .gtop { display: flex; align-items: center; gap: 8px; }
  .gback { background: none; border: 1px solid var(--iron); color: var(--dim); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .gchips { display: flex; gap: 6px; margin-left: auto; }
  .gchip { border: 1px solid var(--iron); background: var(--raised); border-radius: 8px; padding: 8px 14px; font-family: var(--display); font-weight: 700; font-size: 18px; }
  .gchip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  #guide h2 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; margin: 14px 0 2px; }
  .gsub { font-size: 13px; color: var(--dim); }
  .gtrack { display: flex; gap: 5px; margin: 12px 0 2px; }
  .gtrack i { flex: 1; height: 5px; border-radius: 3px; background: var(--iron); display: block; }
  .gtrack i.done { background: var(--done); }
  .gtrack i.active { background: var(--accent); }
  .exlist { background: var(--raised); border: 1px solid var(--rule); border-radius: 12px; padding: 4px 14px; margin: 14px 0 0; list-style: none; }
  .exlist li { display: flex; align-items: baseline; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .exlist li:last-child { border-bottom: none; }
  .exlist .n { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--dim); flex: 0 0 16px; }
  .exlist .a { font-family: var(--display); font-weight: 700; font-size: 18px; flex: 0 0 auto; }
  .exlist .nm { font-size: 15.5px; flex: 1; }
  .glabel { font-size: 12px; color: var(--dim); margin: 18px 2px 6px; }
  .round { background: var(--raised); border: 1px solid var(--rule); border-radius: 12px; margin-top: 10px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 12px; text-align: left; min-height: 58px; }
  .round.locked { opacity: 0.5; }
  .round .box { flex: 0 0 28px; height: 28px; border-radius: 8px; border: 2px solid var(--iron); display: flex; align-items: center; justify-content: center; }
  .round .box svg { width: 16px; height: 16px; opacity: 0; }
  .round.complete .box { background: var(--done-bg); border-color: var(--done); color: var(--done); }
  .round.complete .box svg { opacity: 1; }
  .round .rn { font-family: var(--display); font-weight: 700; font-size: 20px; flex: 1; }
  .round.complete .rn { color: var(--dim); text-decoration: line-through; }
  .round .rs { font-size: 12px; color: var(--dim); }
  .round.complete .rs { color: var(--done); }
  .gfinish { margin-top: 16px; text-align: center; }
  .gfinish .big2 { font-family: var(--display); font-weight: 700; font-size: 24px; color: var(--done); }
  .gfinish .btn { margin-top: 12px; width: 100%; }
  .grest { position: fixed; left: 0; right: 0; bottom: 0; background: var(--raised); border-top: 1px solid var(--rule); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
  .grest .in { max-width: 480px; margin: 0 auto; }
  .grest .r1 { display: flex; align-items: center; gap: 12px; }
  .grest .time { font-family: var(--display); font-weight: 700; font-size: 38px; min-width: 70px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .grest .t1 { font-size: 14px; font-weight: 600; }
  .grest .t2 { font-size: 12px; color: var(--dim); }
  .grest .r2 { display: flex; gap: 9px; margin-top: 9px; }
  #guide { padding-bottom: 150px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Dad Fit · 16 kg kettlebell</div>
  <h1>Dad Fit</h1>

  <div class="banner" id="banner" role="alert" hidden></div>

  <form class="keyform" id="keyform" hidden>
    <label for="keyInput">Type your secret key. You only do this once on this phone.</label>
    <input id="keyInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn primary" type="submit">Save key</button>
  </form>

  <main id="main" hidden>
    <button class="big" id="startBtn" disabled>
      <span class="letter" id="bigLetter">–</span>
      <span><span class="t1" id="bigT1">Loading…</span><span class="t2" id="bigT2"></span></span>
    </button>
    <button class="quick" id="quickBtn" disabled>Already done it? Log it now</button>
    <div class="row" id="altRow"></div>
    <div class="extras">
      <button class="chip" data-sport="rugby" disabled>Tag rugby</button>
      <button class="chip" data-sport="badminton" disabled>Badminton</button>
    </div>

    <section class="card" id="card" aria-live="polite" hidden>
      <div class="title" id="cardTitle"></div>
      <div class="sub" id="cardSub"></div>
      <div id="cardTools">
        <textarea id="noteBox" placeholder="Add a note (optional)" rows="2" maxlength="2000"></textarea>
        <div class="actions">
          <button class="btn undo" id="undoBtn">Undo</button>
          <button class="btn" id="noteBtn">Save note</button>
        </div>
      </div>
    </section>
  </main>

  <section id="guide" hidden>
    <div class="gtop">
      <button class="gback" id="gBack">‹ Back</button>
      <div class="gchips" id="gChips"></div>
    </div>
    <h2 id="gTitle"></h2>
    <div class="gsub" id="gSub"></div>
    <div class="gtrack" id="gTrack"></div>
    <ul class="exlist" id="gEx"></ul>
    <div class="glabel">Tap each round when you finish it</div>
    <div id="gRounds"></div>
    <div class="gfinish" id="gFinish" hidden>
      <div class="big2" id="gFinishT"></div>
      <button class="btn primary" id="gLogBtn">Log this session</button>
    </div>
    <div class="grest" id="gRest">
      <div class="in">
        <div class="r1">
          <div class="time" id="gRestTime">60</div>
          <div><div class="t1" id="gRestT1">Rest between rounds</div><div class="t2" id="gRestT2">Tap start when a round is done</div></div>
        </div>
        <div class="r2">
          <button class="btn" id="gRestReset" style="flex:0 0 auto">Reset</button>
          <button class="btn primary" id="gRestToggle">Start rest</button>
        </div>
      </div>
    </div>
  </section>

  <p class="status" id="status" aria-live="polite"></p>
</div>

<script>
// ---- the one setting: the address of your Google web app (ends in /exec). It is not a secret:
// without your secret key it returns nothing. The key is typed on the phone and never put in this file.
const API_URL = "https://script.google.com/macros/s/AKfycbyNwM0Nmywt_J78p5RkY7NhdIXJBs5_IeTpN88g9JjebvEP328EeCGebZlTsciG-es/exec";

// Rest between rounds, in seconds (the same as your Session A, B and C pages).
const REST = { A: 60, B: 60, C: 90 };

const KEY_NAME = 'dadfit_key';
const $ = (id) => document.getElementById(id);

let data = null;          // the last good answer from the sheet
let busy = false;         // true while a request is in flight
let current = null;       // the entry the confirmation card is about {id}
let pending = null;       // {key, id} of a tap that failed, so retrying it can't log twice
let loadedAt = 0;
let loading = false;      // true while the first answer from the sheet is awaited

// ---------- storage (wrapped: private windows can refuse)
function getKey() { try { return localStorage.getItem(KEY_NAME) || ''; } catch (e) { return ''; } }
function setKey(k) { try { localStorage.setItem(KEY_NAME, k); return true; } catch (e) { return false; } }
function clearKey() { try { localStorage.removeItem(KEY_NAME); } catch (e) {} }

// ---------- talking to the sheet
class ApiError extends Error { constructor(code, message) { super(message); this.code = code; } }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function apiOnce(action, body) {
  if (!API_URL) throw new ApiError('no_url', 'No web app address is set at the top of index.html yet.');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  const t0 = Date.now();
  let res;
  try {
    // text/plain keeps this a "simple" request, which Google web apps accept from any page.
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: getKey(), action }, body || {})), signal: ctl.signal, redirect: 'follow' });
  } catch (e) {
    throw new ApiError('network', "Can't reach the sheet.");
  } finally { clearTimeout(timer); }
  let json;
  try { json = await res.json(); } catch (e) { throw new ApiError('network', "The sheet's reply got lost on the way."); }
  if (window.console) console.debug('dadfit', action, Date.now() - t0 + 'ms', json.timing || '');
  if (!json.ok) throw new ApiError(json.error || 'server_error', json.message || json.error || 'The sheet refused that.');
  // Google has been seen to send a bare {"ok":true} for a request that never ran. Treat a reply that
  // lacks what this action must return as a lost reply, so it is retried and never trusted.
  const complete = { load: json.plan && json.order, add: json.entry, sport: json.entry, note: json.entry, undo: 'undone' in json };
  if (action in complete && !complete[action]) throw new ApiError('network', "The sheet's reply was incomplete.");
  return json;
}

// Google sometimes loses the reply to a POST. Everything except "note" is safe to send again
// (a session or sport tap carries an id, undo checks the id), so those try up to three times.
async function api(action, body, noRetry) {
  const tries = noRetry ? 1 : 3;
  for (let a = 1; ; a++) {
    try { return await apiOnce(action, body); }
    catch (e) { if (e.code !== 'network' || a >= tries) throw e; await sleep(1500); }
  }
}

// ---------- showing things
function banner(fill) {
  const b = $('banner');
  b.replaceChildren();
  if (!fill) { b.hidden = true; return; }
  fill(b);
  b.hidden = false;
}
function bannerText(strong, rest, retryLabel, retryFn) {
  banner((b) => {
    const s = document.createElement('b'); s.textContent = strong; b.append(s, ' ' + rest);
    if (retryFn) { b.append(document.createElement('br')); const r = document.createElement('button'); r.className = 'btn'; r.textContent = retryLabel; r.addEventListener('click', retryFn); b.append(r); }
  });
}

function niceDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return iso || '';
  return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
}

function render() {
  $('keyform').hidden = true;
  if (!$('guide').hidden) { $('main').hidden = true; return; }
  $('main').hidden = false;
  const start = $('startBtn'), quick = $('quickBtn');
  if (!data) {
    $('bigLetter').textContent = '–';
    $('bigT1').textContent = loading ? 'Connecting…' : 'Not connected';
    $('bigT2').textContent = loading ? 'Waiting for the sheet (a few seconds)' : 'Nothing can be logged until the sheet is reachable';
    start.disabled = true; start.dataset.session = ''; quick.hidden = true; quick.disabled = true; quick.dataset.session = '';
    $('altRow').replaceChildren();
    document.querySelectorAll('[data-sport]').forEach((b) => { b.disabled = true; });
    $('status').textContent = '';
    return;
  }
  const due = data.due;
  const next = (data.last ? data.last.n : 0) + 1;
  const canGuide = !!(data.plan[due] && data.plan[due].items);
  $('bigLetter').textContent = due;
  if (canGuide) { $('bigT1').textContent = 'Start Session ' + due; $('bigT2').textContent = 'workout #' + next + ' · logs itself when you finish'; }
  else { $('bigT1').textContent = 'Session ' + due + ' complete'; $('bigT2').textContent = 'workout #' + next; }
  start.dataset.session = due; start.dataset.guide = canGuide ? '1' : '';
  start.disabled = busy;
  quick.hidden = !canGuide;
  quick.textContent = 'Already done it? Log Session ' + due + ' now';
  quick.dataset.session = due; quick.disabled = busy;
  const alt = $('altRow');
  alt.replaceChildren();
  data.order.filter((s) => s !== data.due).forEach((s) => {
    const b = document.createElement('button');
    b.className = 'alt'; b.dataset.session = s; b.disabled = busy;
    const l = document.createElement('span'); l.className = 'letter'; l.textContent = s;
    const w = document.createElement('span');
    const t = document.createElement('span'); t.className = 't'; t.textContent = 'Log Session ' + s;
    const sub = document.createElement('span'); sub.className = 's'; sub.textContent = data.plan[s].day + ' session';
    w.append(t, sub); b.append(l, w); alt.append(b);
  });
  document.querySelectorAll('[data-sport]').forEach((b) => { b.disabled = busy; });
  const last = data.last;
  $('status').textContent = last ? 'Last: ' + last.label + ' · ' + niceDate(last.date) + ' · ' + data.total + ' sessions logged' : 'Nothing logged yet';
}

function showCard(kind, title, sub, entry) {
  const c = $('card');
  c.hidden = false;
  c.classList.toggle('gone', kind === 'gone');
  $('cardTitle').textContent = title;
  $('cardSub').textContent = sub || '';
  $('cardTools').hidden = kind === 'gone';
  $('noteBox').value = '';
  $('noteBtn').textContent = 'Save note';
  $('undoBtn').hidden = !(entry && entry.id);
  current = entry && entry.id ? { id: entry.id } : null;
}

// ---------- loading
async function refresh() {
  if (!data) { loading = true; render(); }
  try {
    data = await api('load');
    loadedAt = Date.now();
    loading = false;
    if (!pending) banner(null);
    render();
  } catch (e) { loading = false; handleError(e, 'load'); }
}

function handleError(e, what, again) {
  if (e.code === 'bad_key') {
    clearKey(); data = null; current = null;
    closeGuide(true);
    $('main').hidden = true; $('card').hidden = true;
    banner(null); $('keyform').hidden = false;
    bannerText('That key was not accepted.', 'Check it and type it again.');
    $('keyInput').value = ''; $('keyInput').focus();
    return;
  }
  if (what === 'load') data = null;
  const msg = e.code === 'network' ? "Can't reach the sheet." : e.message;
  if (what === 'load') {
    bannerText('Not connected.', msg + ' Nothing can be logged until it is back.', 'Try again', () => refresh());
    render();
  } else if (what === 'log') {
    bannerText('NOT confirmed saved.', msg + ' Tap "' + (again || 'the same button') + '" to try again. It will not be logged twice.');
  } else if (what === 'undo') {
    bannerText('Not undone.', msg + ' The entry is still in the sheet.');
  } else {
    bannerText('Not saved.', msg);
  }
}

// ---------- tapping: returns true only when the sheet confirmed the save
async function log(kind, value) {  // kind: 'session' or 'sport'
  if (busy) return false;
  const key = kind + ':' + value;
  if (!pending || pending.key !== key) pending = { key: key, id: 'p' + randomId() };
  setBusy(true);
  banner(null);
  $('card').hidden = true; current = null;
  $('status').textContent = 'Saving… this can take a few seconds. Please wait.';
  try {
    const r = kind === 'session' ? await api('add', { session: value, id: pending.id }) : await api('sport', { activity: value, id: pending.id });
    pending = null;
    const e = r.entry;
    if (kind === 'session') showCard('ok', '✓ ' + e.label + ' logged', 'Workout #' + e.n + ' · ' + niceDate(e.date) + (e.time ? ' · ' + e.time : '') + (e.onSchedule === 'No' ? ' · not on its usual day' : ''), e);
    else showCard('ok', '✓ ' + e.label + ' logged', niceDate(e.date), e);
    setBusy(false);
    await refresh();
    return true;
  } catch (err) {
    setBusy(false);
    if (err.code === 'bad_request' || err.code === 'bad_plan') pending = null;
    render();
    handleError(err, 'log', kind === 'session' ? (value === (data && data.due) ? 'Log Session ' + value + ' now' : 'Log Session ' + value) : (value === 'rugby' ? 'Tag rugby' : 'Badminton'));
    return false;
  }
}

async function undo() {
  if (busy || !current) return;
  setBusy(true); banner(null);
  try {
    const r = await api('undo', { id: current.id });
    if (r.undone) showCard('gone', 'Undone', (r.entry && r.entry.label ? r.entry.label + ' removed from the sheet.' : 'Removed from the sheet.')); else showCard('gone', 'Already removed', '');
    current = null; pending = null;
    setBusy(false);
    await refresh();
  } catch (err) { setBusy(false); handleError(err, 'undo'); }
}

async function saveNote() {
  const text = $('noteBox').value.trim();
  if (busy || !current || !text) return;
  setBusy(true); banner(null);
  try {
    await api('note', { id: current.id, note: text }, true);   // not retried: a note would be added twice
    $('noteBox').value = '';
    $('noteBtn').textContent = 'Note saved ✓';
  } catch (err) { handleError(err, 'note'); }
  setBusy(false);
}

function setBusy(b) {
  busy = b;
  document.querySelectorAll('#startBtn, #quickBtn, .alt, [data-sport], #undoBtn, #noteBtn').forEach((el) => { el.disabled = b || (data === null && el.id !== 'undoBtn' && el.id !== 'noteBtn'); });
}

function randomId() {
  const a = new Uint8Array(8);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.from(a, (x) => x.toString(16).padStart(2, '0')).join('');
}

// =====================================================================
// Session guide: the exercises, a tick for each round, a rest timer, and it logs itself at the end.
// What to do comes from the Plan tab in your sheet, so changing the plan there changes this.
// =====================================================================
const g = { letter: '', checks: [], restLeft: 0, restEnd: 0, running: false, timer: null, wake: null };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"></polyline></svg>';

function today() { return new Date().toLocaleDateString('en-CA'); }   // local date, e.g. 2026-10-07
function gKey(letter) { return 'dadfit_guide_' + letter + '_' + today(); }
function gLoad(letter, rounds) {
  try { const p = JSON.parse(localStorage.getItem(gKey(letter))); if (p && Array.isArray(p.checks) && p.checks.length === rounds) return p.checks; } catch (e) {}
  return Array(rounds).fill(false);
}
function gSave() { try { localStorage.setItem(gKey(g.letter), JSON.stringify({ checks: g.checks })); } catch (e) {} }
function gClear(letter) { try { localStorage.removeItem(gKey(letter)); } catch (e) {} }

function plan() { return data && data.plan[g.letter]; }
function amountText(it) { return it.amount == null ? '–' : (it.unit === 'sec' ? it.amount + '-sec' : String(it.amount)); }
function nameText(it) {
  const n = it.name.charAt(0).toUpperCase() + it.name.slice(1);
  return n + (it.variant ? ', ' + it.variant : '') + (it.per_side ? ', each ' + it.per_side : '');
}
function nextRound() { return g.checks.indexOf(false); }

function openGuide(letter) {
  if (!data || !data.plan[letter] || !data.plan[letter].items) return;
  stopRest(true);
  g.letter = letter;
  g.checks = gLoad(letter, data.plan[letter].rounds);
  g.restLeft = REST[letter] || 60;
  $('main').hidden = true; $('card').hidden = true; $('guide').hidden = false; $('status').hidden = true;
  window.scrollTo(0, 0);
  wakeOn();
  renderGuide();
}

function closeGuide(silent) {
  stopRest(true);
  wakeOff();
  $('guide').hidden = true; $('status').hidden = false;
  if (!silent) { $('main').hidden = false; render(); }
}

function renderGuide() {
  const p = plan();
  const rounds = p.rounds;
  const next = nextRound();
  const doneN = g.checks.filter(Boolean).length;
  $('gChips').replaceChildren(...['A', 'B', 'C'].map((l) => {
    const b = document.createElement('button'); b.className = 'gchip' + (l === g.letter ? ' on' : ''); b.textContent = l;
    b.addEventListener('click', () => { if (l !== g.letter) openGuide(l); });
    return b;
  }));
  $('gTitle').textContent = 'Session ' + g.letter;
  $('gSub').textContent = next === -1 ? 'All ' + rounds + ' rounds done' : 'Round ' + (next + 1) + ' of ' + rounds + ' · ' + doneN + '/' + rounds + ' done · rest ' + (REST[g.letter] || 60) + ' sec';
  $('gTrack').replaceChildren(...g.checks.map((c, i) => { const s = document.createElement('i'); s.className = c ? 'done' : (i === next ? 'active' : ''); return s; }));
  $('gEx').replaceChildren(...p.items.map((it, i) => {
    const li = document.createElement('li');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    const a = document.createElement('span'); a.className = 'a'; a.textContent = amountText(it);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = nameText(it);
    li.append(n, a, nm); return li;
  }));
  $('gRounds').replaceChildren(...g.checks.map((c, i) => {
    const b = document.createElement('button');
    b.className = 'round' + (c ? ' complete' : '') + (!c && i !== next ? ' locked' : '');
    const box = document.createElement('span'); box.className = 'box'; box.innerHTML = CHECK;
    const rn = document.createElement('span'); rn.className = 'rn'; rn.textContent = 'Round ' + (i + 1);
    const rs = document.createElement('span'); rs.className = 'rs'; rs.textContent = c ? 'Done' : (i === next ? 'Now' : '');
    b.append(box, rn, rs);
    b.addEventListener('click', () => toggleRound(i));
    return b;
  }));
  const all = next === -1;
  $('gFinish').hidden = !all;
  $('gRest').hidden = all;
  if (all) $('gFinishT').textContent = 'Session ' + g.letter + ' done';
  renderRest();
}

function toggleRound(i) {
  g.checks[i] = !g.checks[i];
  gSave();
  const finishedNow = nextRound() === -1 && g.checks[i];
  if (finishedNow) stopRest(true);
  renderGuide();
  if (finishedNow) finishGuide();
}

// Done: go back to the main screen and log it. If the sheet can't be reached the ticks are kept
// and the "Log this session" button stays here, so nothing is lost and nothing is pretended.
async function finishGuide() {
  const letter = g.letter;
  closeGuide();
  const ok = await log('session', letter);
  if (ok) gClear(letter);
}

// ---- rest timer (works from the clock, so it stays right if the phone sleeps)
function renderRest() {
  const next = nextRound();
  if (next === -1) return;
  const full = REST[g.letter] || 60;
  $('gRestTime').textContent = g.restLeft;
  const t1 = $('gRestT1'), t2 = $('gRestT2'), btn = $('gRestToggle');
  if (g.running) { t1.textContent = 'Resting before round ' + (next + 1); t2.textContent = 'Tap stop to cut it short'; btn.textContent = 'Stop rest'; }
  else if (g.restLeft === 0) { t1.textContent = "Rest's up"; t2.textContent = 'Go on to round ' + (next + 1); btn.textContent = 'Start rest'; }
  else if (g.restLeft < full) { t1.textContent = 'Rest paused'; t2.textContent = 'Tap resume to keep resting'; btn.textContent = 'Resume rest'; }
  else { t1.textContent = next === 0 ? 'Rest between rounds' : 'Round ' + next + ' down'; t2.textContent = next === 0 ? 'Tap start once round 1 is done' : 'Tap start when you are ready to rest'; btn.textContent = 'Start rest'; }
}
function startRest() {
  if (g.running) return;
  if (g.restLeft === 0) g.restLeft = REST[g.letter] || 60;
  g.restEnd = Date.now() + g.restLeft * 1000;
  g.running = true;
  g.timer = setInterval(tickRest, 250);
  renderRest();
}
function tickRest() {
  g.restLeft = Math.max(0, Math.ceil((g.restEnd - Date.now()) / 1000));
  if (g.restLeft <= 0) { stopRest(false); if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} } }
  renderRest();
}
function stopRest(resetToFull) {
  g.running = false;
  clearInterval(g.timer); g.timer = null;
  if (resetToFull) g.restLeft = REST[g.letter] || 60;
  if (!$('guide').hidden) renderRest();
}

// ---- keep the screen on while the guide is open (where the phone allows it)
async function wakeOn() { try { if (navigator.wakeLock && !g.wake) { g.wake = await navigator.wakeLock.request('screen'); g.wake.addEventListener('release', () => { g.wake = null; }); } } catch (e) {} }
function wakeOff() { try { if (g.wake) g.wake.release(); } catch (e) {} g.wake = null; }

// ---------- wiring
$('startBtn').addEventListener('click', () => {
  const s = $('startBtn').dataset.session;
  if (!s) return;
  if ($('startBtn').dataset.guide) openGuide(s); else log('session', s);
});
$('quickBtn').addEventListener('click', () => { if ($('quickBtn').dataset.session) log('session', $('quickBtn').dataset.session); });
$('altRow').addEventListener('click', (e) => { const b = e.target.closest('.alt'); if (b) log('session', b.dataset.session); });
document.querySelectorAll('[data-sport]').forEach((b) => b.addEventListener('click', () => log('sport', b.dataset.sport)));
$('undoBtn').addEventListener('click', undo);
$('noteBtn').addEventListener('click', saveNote);
$('gBack').addEventListener('click', () => closeGuide());
$('gLogBtn').addEventListener('click', () => finishGuide());
$('gRestToggle').addEventListener('click', () => { if (g.running) stopRest(false); else startRest(); });
$('gRestReset').addEventListener('click', () => { stopRest(true); });
$('keyform').addEventListener('submit', (e) => {
  e.preventDefault();
  const k = $('keyInput').value.trim();
  if (!k) return;
  if (!setKey(k)) { bannerText("This browser won't remember the key.", 'Turn off private browsing, then try again.'); return; }
  $('keyInput').value = '';
  banner(null);
  $('keyform').hidden = true;
  $('main').hidden = false;
  render();
  refresh();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!$('guide').hidden) { wakeOn(); if (g.running) tickRest(); }
  else if (getKey() && !busy && Date.now() - loadedAt > 60000) refresh();
});

(function start() {
  if (!API_URL) { bannerText('Not set up yet.', 'The web app address is missing at the top of index.html.'); return; }
  if (!getKey()) { $('keyform').hidden = false; $('keyInput').focus(); return; }
  $('main').hidden = false;
  render();
  refresh();
})();
</script>
</body></html>
